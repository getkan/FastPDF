name: Publish Docker Image

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Get package version
        id: package_version
        run: |
          repo_root="${GITHUB_WORKSPACE:-$(git rev-parse --show-toplevel)}"
          version=$(node -p "require(process.argv[1]).version" "$repo_root/package.json")
          output_file="${GITHUB_OUTPUT:-/tmp/github_output.txt}"
          echo "version=$version" >> "$output_file"

      - name: Ensure package version is set
        run: |
          if [ -z "${{ steps.package_version.outputs.version }}" ]; then
            echo "Package version is empty. Aborting."
            exit 1
          else
            echo "Package version: ${{ steps.package_version.outputs.version }}"
          fi

      # Docker Hub login (recommended default)
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKER_USERNAME }}/fast-pdf
          tags: |
            type=raw,value=latest
            type=raw,value=${{ steps.package_version.outputs.version }}

      - name: Build and push
        id: build-and-push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Show published image refs
        run: |
          echo "Published tags:"
          echo "${{ steps.meta.outputs.tags }}"
          echo "Digest: ${{ steps.build-and-push.outputs.digest }}"